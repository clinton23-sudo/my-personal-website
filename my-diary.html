<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Private Diary | Clinton Ncube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
        }

        nav {
            background: #1f2937;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a:hover {
            background: #374151;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
        }

        .login-card {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .lock-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .login-card h2 {
            margin-bottom: 10px;
        }

        .login-card p {
            color: #666;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .logout-btn {
            max-width: 180px;
            margin: 20px auto;
            display: block;
            background: #b91c1c;
        }

        .logout-btn:hover {
            background: #991b1b;
        }

        .error {
            color: #b91c1c;
            margin-top: 12px;
            display: none;
        }

        .loading {
            text-align: center;
            color: #666;
        }

        .diary-entry {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .diary-entry h2 {
            margin-top: 0;
            color: #111827;
        }

        .date {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .section {
            margin-top: 20px;
        }

        .section h3 {
            margin-bottom: 8px;
            color: #374151;
        }

        .section p {
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .private-note {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 10px;
        }

        .diary-photo {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            background: #111827;
            color: white;
        }

        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                width: 94%;
            }

            .login-card {
                margin-top: 30px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🔐 My Private Diary</h1>
    <p>My personal space</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="skills.html">Skills</a>
    <a href="gallery.html">Gallery</a>
    <a href="achievements.html">Achievements</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-card">

        <div class="lock-icon">🔒</div>

        <h2>Private Diary</h2>

        <p>
            This diary is private. Sign in with your authorised
            Firebase account to continue.
        </p>

        <input
            type="email"
            id="email"
            placeholder="Email address"
            autocomplete="username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button id="loginButton">
            🔓 Sign In
        </button>

        <div id="loginError" class="error"></div>

    </div>


    <!-- DIARY CONTENT -->
    <div id="diaryScreen" style="display:none;">

        <h2>📖 My Memories</h2>

        <p class="loading" id="loadingMessage">
            Loading your private diary...
        </p>

        <div id="diaryContainer"></div>

        <button class="logout-btn" id="logoutButton">
            🔒 Lock Diary
        </button>

    </div>

</div>

<footer>
    <p>© 2026 Clinton Ncube | Private Diary</p>
</footer>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    // FIREBASE CONFIG

    const firebaseConfig = {
        apiKey: "AIzaSyCWKqho3sPz1W6wGEftS3nNSaJigR-1vd4",
        authDomain: "clinton-ncube-website.firebaseapp.com",
        databaseURL: "https://clinton-ncube-website-default-rtdb.firebaseio.com",
        projectId: "clinton-ncube-website",
        storageBucket: "clinton-ncube-website.firebasestorage.app",
        messagingSenderId: "946671700613",
        appId: "1:946671700613:web:5d74536df1dbb0d35e77ec",
        measurementId: "G-K1S62MHHXP"
    };


    // START FIREBASE

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    // ELEMENTS

    const loginScreen =
        document.getElementById("loginScreen");

    const diaryScreen =
        document.getElementById("diaryScreen");

    const loginButton =
        document.getElementById("loginButton");

    const logoutButton =
        document.getElementById("logoutButton");

    const loginError =
        document.getElementById("loginError");

    const diaryContainer =
        document.getElementById("diaryContainer");

    const loadingMessage =
        document.getElementById("loadingMessage");


    // ESCAPE HTML

    function escapeHTML(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // LOGIN

    loginButton.addEventListener("click", async () => {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        loginError.style.display = "none";

        if (!email || !password) {

            loginError.textContent =
                "Please enter your email and password.";

            loginError.style.display = "block";

            return;
        }

        loginButton.disabled = true;

        loginButton.textContent = "Signing in...";

        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        } catch (error) {

            console.error(error);

            loginError.textContent =
                "Sign in failed. Please check your email and password.";

            loginError.style.display = "block";

        } finally {

            loginButton.disabled = false;

            loginButton.textContent = "🔓 Sign In";

        }

    });


    // LOGOUT

    logoutButton.addEventListener("click", async () => {

        await signOut(auth);

    });


    // AUTH STATE

    onAuthStateChanged(auth, (user) => {

        if (user) {

            loginScreen.style.display = "none";

            diaryScreen.style.display = "block";

            loadDiary();

        } else {

            loginScreen.style.display = "block";

            diaryScreen.style.display = "none";

            diaryContainer.innerHTML = "";

        }

    });


    // LOAD DIARY

    function loadDiary() {

        loadingMessage.style.display = "block";

        const diaryRef =
            ref(db, "diary");

        onValue(diaryRef, (snapshot) => {

            diaryContainer.innerHTML = "";

            loadingMessage.style.display = "none";

            if (!snapshot.exists()) {

                diaryContainer.innerHTML = `
                    <div class="empty">
                        <h3>📖 Your diary is empty</h3>
                        <p>
                            Your private diary entries will appear here.
                        </p>
                    </div>
                `;

                return;
            }


            const entries = [];

            snapshot.forEach((child) => {

                entries.push({
                    id: child.key,
                    ...child.val()
                });

            });


            // NEWEST FIRST

            entries.reverse();


            entries.forEach((entry) => {

                const card =
                    document.createElement("div");

                card.className = "diary-entry";

                card.innerHTML = `

                    <h2>
                        ${escapeHTML(entry.title || "Untitled Memory")}
                    </h2>

                    <div class="date">
                        📅 ${escapeHTML(entry.date || "")}
                    </div>

                    <div class="section">

                        <h3>📝 What happened?</h3>

                        <p>
                            ${escapeHTML(entry.happened || "")}
                        </p>

                    </div>

                    <div class="section">

                        <h3>💭 How I felt</h3>

                        <p>
                            ${escapeHTML(entry.feelings || "")}
                        </p>

                    </div>

                    <div class="section">

                        <h3>📌 Personal notes</h3>

                        <div class="private-note">

                            <p>
                                ${escapeHTML(entry.notes || "")}
                            </p>

                        </div>

                    </div>

                    ${
                        entry.photo
                        ?
                        `
                        <div class="section">

                            <h3>📷 Memory Photo</h3>

                            <img
                                class="diary-photo"
                                src="${escapeHTML(entry.photo)}"
                                alt="Private diary memory"
                                onerror="this.style.display='none';"
                            >

                        </div>
                        `
                        :
                        ""
                    }

                `;

                diaryContainer.appendChild(card);

            });

        });

    }

</script>

</body>
</html>
