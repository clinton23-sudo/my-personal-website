    <!-- FIREBASE -->

    <script type="module">


        /*
         * FIREBASE IMPORTS
         */

        import {
            initializeApp
        }
        from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


        import {
            getDatabase,
            ref,
            onValue
        }
        from
        "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";



        /*
         * FIREBASE CONFIGURATION
         */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCWKqho3sPz1W6wGEftS3nNSaJigR-1vd4",

            authDomain:
                "clinton-ncube-website.firebaseapp.com",

            databaseURL:
                "https://clinton-ncube-website-default-rtdb.firebaseio.com",

            projectId:
                "clinton-ncube-website",

            storageBucket:
                "clinton-ncube-website.firebasestorage.app",

            messagingSenderId:
                "946671700613",

            appId:
                "1:946671700613:web:5d74536df1dbb0d35e77ec",

            measurementId:
                "G-K1S62MHHXP"

        };



        /*
         * INITIALIZE FIREBASE
         */

        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);



        /*
         * ACHIEVEMENTS DATABASE
         */

        const achievementsRef =
            ref(db, "achievements");



        /*
         * LOAD ACHIEVEMENTS
         */

        onValue(

            achievementsRef,

            (snapshot) => {


                const container =
                    document.getElementById(
                        "achievements-container"
                    );


                container.innerHTML = "";



                /*
                 * NO ACHIEVEMENTS
                 */

                if (!snapshot.exists()) {

                    container.innerHTML = `

                        <div class="card">

                            <h3>
                                No Achievements Yet
                            </h3>

                            <p>
                                Achievements added
                                through the Admin
                                Dashboard will
                                appear here.
                            </p>

                        </div>

                    `;

                    return;

                }



                /*
                 * GET FIREBASE DATA
                 */

                const achievements =
                    snapshot.val();



                /*
                 * CREATE ACHIEVEMENT CARDS
                 */

                Object.entries(achievements)
                    .forEach(
                        ([id, achievement]) => {


                            const card =
                                document.createElement(
                                    "div"
                                );


                            card.className =
                                "card";



                            card.innerHTML = `

                                <h3>
                                    🏆
                                    ${escapeHTML(
                                        achievement.title ||
                                        "Achievement"
                                    )}
                                </h3>

                                <p>
                                    ${escapeHTML(
                                        achievement.description ||
                                        ""
                                    )}
                                </p>

                            `;


                            container.appendChild(
                                card
                            );

                        }
                    );

            },

            (error) => {


                console.error(
                    "Firebase Achievements Error:",
                    error
                );


                document.getElementById(
                    "achievements-container"
                ).innerHTML = `

                    <div class="card">

                        <h3>
                            Achievements Error
                        </h3>

                        <p>
                            The achievements
                            could not be loaded.
                            Please try again later.
                        </p>

                    </div>

                `;

            }

        );



        /*
         * SECURITY FUNCTION
         */

        function escapeHTML(value) {

            return String(value)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


    </script>
