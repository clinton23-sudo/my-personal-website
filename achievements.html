<body>

<header class="page-header">
    <h1>🏆 My Achievements</h1>
    <p>Some of my achievements and accomplishments</p>
</header>

<section>

    <div class="container">

        <div id="achievementsContainer" class="cards">

            <div class="loading">
                Loading achievements...
            </div>

        </div>

    </div>

</section>

<footer>
    <p>© 2026 Clinton Ncube. All rights reserved.</p>
    <p>Personal Portfolio Website</p>
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyB66c1Tymv5lkTxY89HLbX4S_QTpAZQVUE",

    authDomain: "clinton-ncube-website.firebaseapp.com",

    databaseURL:
        "https://clinton-ncube-website-default-rtdb.firebaseio.com",

    projectId: "clinton-ncube-website",

    storageBucket:
        "clinton-ncube-website.firebasestorage.app",

    messagingSenderId: "946671700613",

    appId:
        "1:946671700613:web:5d74536df1dbb0d35e77ec",

    measurementId: "G-K1S62MHHXP"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const achievementsRef =
    ref(db, "achievements");

const container =
    document.getElementById("achievementsContainer");


function escapeHTML(value) {

    const div = document.createElement("div");

    div.textContent = value || "";

    return div.innerHTML;
}


onValue(
    achievementsRef,
    (snapshot) => {

        const data = snapshot.val();

        container.innerHTML = "";

        if (!data) {

            container.innerHTML = `
                <div class="empty">
                    <h3>No achievements yet</h3>
                    <p>
                        Achievements added through the
                        Admin Dashboard will appear here.
                    </p>
                </div>
            `;

            return;
        }


        Object.values(data).forEach(achievement => {

            const card =
                document.createElement("div");

            card.className = "card";

            card.innerHTML = `

                <div style="
                    font-size:2.8rem;
                    margin-bottom:12px;
                ">
                    🏆
                </div>

                <h3>
                    ${escapeHTML(achievement.title)}
                </h3>

                <p>
                    ${escapeHTML(achievement.description)}
                </p>

            `;

            container.appendChild(card);

        });

    },

    error => {

        container.innerHTML = `
            <div class="empty">
                Unable to load achievements.
            </div>
        `;

        console.error(error);

    }
);

</script>

</body>
</html>
