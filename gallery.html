<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Clinton Ncube</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Clinton Ncube</h1>

        <p>
            My Personal Gallery
        </p>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">

            <a href="projects.html">

            <a href="hobbies.html">

            <a href="skills.html">

            <a class="active" href="gallery.html">

            <a href="contact.html">

            </a>

            <a href="achievements.html">

            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main>

        <section>

            <h2>
                My Gallery 📸
            </h2>

            <p>
                Welcome to my gallery. Here are some
                of my favourite photos and memories.
            </p>

        </section>


        <!-- GALLERY -->

        <section>

            <div
                id="gallery-container"
                class="card-container"
            >

                <p>
                    Loading gallery...
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            &copy; 2026 Clinton Ncube
        </p>

        <p>
            Built with HTML & CSS |
            My Personal Portfolio
        </p>

    </footer>



    <!-- FIREBASE -->

    <script type="module">

        import { initializeApp }

        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


        import {

            getDatabase,
            ref,
            onValue

        }

        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";



        /*
         * FIREBASE CONFIGURATION
         */

        const firebaseConfig = {

            apiKey:
                "AIzaSyCWKqho3sPz1W6wGEftS3nNSaJigR-1vd4",

            authDomain:
                "clinton-ncube-website.firebaseapp.com",

            databaseURL:
                "https://clinton-ncube-website-default-rtdb.firebaseio.com",

            projectId:
                "clinton-ncube-website",

            storageBucket:
                "clinton-ncube-website.firebasestorage.app",

            messagingSenderId:
                "946671700613",

            appId:
                "1:946671700613:web:5d74536df1dbb0d35e77ec",

            measurementId:
                "G-K1S62MHHXP"

        };



        /*
         * START FIREBASE
         */

        const app =
            initializeApp(firebaseConfig);


        const db =
            getDatabase(app);



        /*
         * GALLERY DATABASE
         */

        const galleryRef =
            ref(db, "gallery");



        /*
         * DISPLAY GALLERY
         */

        onValue(

            galleryRef,

            (snapshot) => {

                const container =
                    document.getElementById(
                        "gallery-container"
                    );


                container.innerHTML = "";


                if (!snapshot.exists()) {

                    container.innerHTML = `

                        <div class="card">

                            <h3>
                                No Photos Yet
                            </h3>

                            <p>
                                Photos added from the
                                Admin Dashboard will
                                appear here.
                            </p>

                        </div>

                    `;

                    return;

                }


                const gallery =
                    snapshot.val();


                Object.entries(gallery)
                    .forEach(
                        ([id, photo]) => {


                            const card =
                                document.createElement(
                                    "div"
                                );


                            card.className =
                                "card";


                            /*
                             * Create image path
                             */

                            const imagePath =
                                "images/" +
                                photo.file;



                            card.innerHTML = `

                                <img
                                    src="${escapeHTML(imagePath)}"
                                    alt="${escapeHTML(photo.title || "Gallery photo")}"
                                    style="
                                        width:100%;
                                        max-width:500px;
                                        border-radius:10px;
                                        display:block;
                                        margin:auto;
                                    "
                                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
                                >

                                <p
                                    style="
                                        display:none;
                                        color:#b91c1c;
                                        font-weight:bold;
                                        text-align:center;
                                    "
                                >
                                    ❌ Image not found:
                                    images/${escapeHTML(photo.file || "")}
                                </p>

                                <h3>
                                    ${escapeHTML(
                                        photo.title ||
                                        "Untitled Photo"
                                    )}
                                </h3>

                                <p>
                                    ${escapeHTML(
                                        photo.description ||
                                        ""
                                    )}
                                </p>

                            `;


                            container.appendChild(
                                card
                            );

                        }
                    );

            },

            (error) => {

                console.error(
                    "Firebase Gallery Error:",
                    error
                );


                document.getElementById(
                    "gallery-container"
                ).innerHTML = `

                    <div class="card">

                        <h3>
                            Gallery Error
                        </h3>

                        <p>
                            The gallery could not
                            be loaded right now.
                        </p>

                    </div>

                `;

            }

        );



        /*
         * SECURITY FUNCTION
         *
         * Prevents HTML entered in the
         * Admin Dashboard from being
         * interpreted as website code.
         */

        function escapeHTML(value) {

            return String(value)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }

    </script>

</body>

</html>
