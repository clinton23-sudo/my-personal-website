<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Clinton Ncube</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .intro h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .intro p {
            color: #666;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .gallery-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0,0,0,0.1);
            transition: transform 0.25s ease;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
        }

        .gallery-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #ddd;
        }

        .gallery-content {
            padding: 18px;
        }

        .gallery-content h3 {
            margin-bottom: 8px;
            font-size: 20px;
        }

        .gallery-content p {
            color: #666;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #666;
        }

        .empty {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            color: #666;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            background: #111827;
            color: white;
            text-align: center;
        }

        @media (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 5px;
            }

            .intro h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Clinton Ncube</h1>
    <p>My Personal Gallery</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="hobbies.html">Hobbies</a>
        <a href="skills.html">Skills</a>
        <a href="achievements.html">Achievements</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="container">

    <div class="intro">
        <h2>My Gallery</h2>
        <p>Photos and memories from my school life, projects and activities.</p>
    </div>

    <div id="gallery" class="gallery">

        <div class="loading">
            Loading gallery...
        </div>

    </div>

</div>

<footer>
    <p>© 2026 Clinton Ncube. All rights reserved.</p>
</footer>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    const firebaseConfig = {
        apiKey: "AIzaSyB66c1Tymv5lkTxY89HLbX4S_QTpAZQVUE",
        authDomain: "clinton-ncube-website.firebaseapp.com",
        databaseURL: "https://clinton-ncube-website-default-rtdb.firebaseio.com",
        projectId: "clinton-ncube-website",
        storageBucket: "clinton-ncube-website.firebasestorage.app",
        messagingSenderId: "946671700613",
        appId: "1:946671700613:web:5d74536df1dbb0d35e77ec",
        measurementId: "G-K1S62MHHXP"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);

    const galleryRef = ref(db, "gallery");

    const galleryContainer = document.getElementById("gallery");


    onValue(galleryRef, (snapshot) => {

        galleryContainer.innerHTML = "";

        if (!snapshot.exists()) {

            galleryContainer.innerHTML = `
                <div class="empty">
                    <h3>No gallery items yet.</h3>
                    <p>Gallery photos will appear here when they are added from the Admin Dashboard.</p>
                </div>
            `;

            return;
        }


        const items = snapshot.val();


        Object.entries(items).forEach(([id, item]) => {

            const card = document.createElement("div");

            card.className = "gallery-card";


            const image = document.createElement("img");

            image.src = item.file || "";

            image.alt = item.title || "Gallery image";

            image.onerror = function () {

                this.style.display = "none";

            };


            const content = document.createElement("div");

            content.className = "gallery-content";


            const title = document.createElement("h3");

            title.textContent = item.title || "Untitled";


            const description = document.createElement("p");

            description.textContent =
                item.description || "";


            content.appendChild(title);

            content.appendChild(description);


            card.appendChild(image);

            card.appendChild(content);


            galleryContainer.appendChild(card);

        });

    });

</script>

</body>
</html>
