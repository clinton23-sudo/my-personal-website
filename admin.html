/* =====================================================

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/* =====================================================

const loginSection =

const dashboard =

const emailInput =

const passwordInput =

const loginStatus =

/* =====================================================
   STATUS
===================================================== */

function showStatus(element, message, type) {

    element.textContent = message;

    element.className =
        "status " +
        (type === "success"
            ? "success-message"
            : "error-message");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    if (!value) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =====================================================
   LOGIN
===================================================== */

loginButton.addEventListener("click", async () => {

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    if (!email || !password) {

        showStatus(
            loginStatus,
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    loginButton.disabled = true;

    loginButton.textContent =
        "Logging in...";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    } catch (error) {

        console.error(error);

        showStatus(
            loginStatus,
            "Login failed: " + error.message,
            "error"
        );

        loginButton.disabled = false;

        loginButton.textContent =
            "Login";
    }

});


/* =====================================================
   LOGOUT
===================================================== */

logoutButton.addEventListener("click", async () => {

    await signOut(auth);

});


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(auth, user => {

    if (user) {

        loginSection.classList.add("hidden");

        dashboard.classList.remove("hidden");

        userEmail.textContent =
            user.email || "";

        loadHome();

        loadGallery();

        loadAchievements();

        loadProjects();

        loadHobbies();

        loadSkills();

        loadDiary();

    } else {

        loginSection.classList.remove("hidden");

        dashboard.classList.add("hidden");

        userEmail.textContent = "";

    }

});


/* =====================================================
   HOME
===================================================== */

async function loadHome() {

    try {

        const snapshot =
            await get(ref(db, "websiteData"));

        if (!snapshot.exists()) return;

        const data =
            snapshot.val();

        document.getElementById("homeName").value =
            data.name || "";

        document.getElementById("homeWelcome").value =
            data.welcome || "";

        document.getElementById("homeGoal").value =
            data.goal || "";

        document.getElementById("homeAbout").value =
            data.about || "";

        document.getElementById("homeUpdated").value =
            data.lastUpdated || "";

    } catch (error) {

        console.error(error);

    }

}


document
.getElementById("saveHome")
.addEventListener("click", async () => {

    try {

        await set(
            ref(db, "websiteData"),
            {

                name:
                document.getElementById("homeName").value,

                welcome:
                document.getElementById("homeWelcome").value,

                goal:
                document.getElementById("homeGoal").value,

                about:
                document.getElementById("homeAbout").value,

                lastUpdated:
                document.getElementById("homeUpdated").value

            }
        );

        showStatus(
            document.getElementById("homeStatus"),
            "Home information saved successfully.",
            "success"
        );

    } catch (error) {

        showStatus(
            document.getElementById("homeStatus"),
            error.message,
            "error"
        );

    }

});


/* =====================================================
   GALLERY
===================================================== */

document
.getElementById("addGallery")
.addEventListener("click", async () => {

    const title =
        document.getElementById("galleryTitle").value.trim();

    const file =
        document.getElementById("galleryFile").value.trim();

    const description =
        document.getElementById("galleryDescription").value.trim();

    if (!title || !file) {

        alert("Enter a title and image filename.");

        return;
    }

    await push(
        ref(db, "gallery"),
        {
            title,
            file,
            description
        }
    );

    document.getElementById("galleryTitle").value = "";

    document.getElementById("galleryFile").value = "";

    document.getElementById("galleryDescription").value = "";

});


function loadGallery() {

    onValue(
        ref(db, "gallery"),
        snapshot => {

            const list =
                document.getElementById("galleryList");

            list.innerHTML = "";

            if (!snapshot.exists()) {

                list.innerHTML =
                    "<p>No gallery items yet.</p>";

                return;
            }

            snapshot.forEach(child => {

                const data =
                    child.val();

                const item =
                    document.createElement("div");

                item.className = "item";

                item.innerHTML = `

                    <strong>
                        ${escapeHTML(data.title)}
                    </strong>

                    <p>
                        ${escapeHTML(data.description)}
                    </p>

                    <p>
                        ${escapeHTML(data.file)}
                    </p>

                    <button
                        class="danger"
                        data-id="${child.key}">
                        Delete
                    </button>
                `;

                item
                .querySelector("button")
                .addEventListener("click", async () => {

                    if (
                        confirm(
                            "Delete this gallery item?"
                        )
                    ) {

                        await remove(
                            ref(
                                db,
                                "gallery/" + child.key
                            )
                        );

                    }

                });

                list.appendChild(item);

            });

        }
    );

}

function loadDiary() {

    onValue(
        ref(db, "diary"),
        snapshot => {

            const list =
                document.getElementById("diaryList");

            list.innerHTML = "";

            if (!snapshot.exists()) {

                list.innerHTML =
                    "<p>No diary entries yet.</p>";

                return;
            }

            const entries = [];

            snapshot.forEach(child => {

                entries.push({
                    id: child.key,
                    data: child.val()
                });

            });

            entries.sort(
                (a, b) =>
                    String(b.data.date || "")
                    .localeCompare(
                        String(a.data.date || "")
                    )
            );

            entries.forEach(entry => {

                const data =
                    entry.data;

                const item =
                    document.createElement("div");

                item.className = "item";

                item.innerHTML = `

                    <strong>
                        ${escapeHTML(data.title)}
                    </strong>

                    <p>
                        <strong>Date:</strong>
                        ${escapeHTML(data.date)}
                    </p>

                    <p>
                        <strong>What happened:</strong><br>
                        ${escapeHTML(data.happened)}
                    </p>

                    <p>
                        <strong>Feelings:</strong><br>
                        ${escapeHTML(data.feelings)}
                    </p>

                    <p>
                        <strong>Notes:</strong><br>
                        ${escapeHTML(data.notes)}
                    </p>

                    ${
                        data.photo
                        ?
                        `<p>
                            <strong>Photo:</strong>
                            ${escapeHTML(data.photo)}
                        </p>`
                        :
                        ""
                    }

                    <button class="danger">
                        Delete
                    </button>
                `;

                item
                .querySelector("button")
                .addEventListener("click", async () => {

                    if (confirm("Delete this diary entry?")) {

                        await remove(
                            ref(
                                db,
                                "diary/" + entry.id
                            )
                        );

                    }

                });

                list.appendChild(item);

            });

        }
    );

}
