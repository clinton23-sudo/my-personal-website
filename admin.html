<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Clinton Ncube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            margin-left: 8px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .logout-btn {
            background: #6b7280;
            color: white;
        }

        .logout-btn:hover {
            background: #4b5563;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .item {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            background: #fafafa;
        }

        .item h3 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .item p {
            color: #4b5563;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .item-actions {
            margin-top: 10px;
        }

        .login-box {
            max-width: 500px;
            margin: 50px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
        }

        .photo-preview {
            max-width: 150px;
            max-height: 100px;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        .diary-manager {
            border: 2px solid #111827;
        }

        .diary-entry {
            border-left: 5px solid #111827;
        }

        .diary-entry h3 {
            color: #111827;
        }

        .private-label {
            display: inline-block;
            background: #111827;
            color: white;
            padding: 5px 9px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .photo-note {
            font-size: 13px;
            color: #6b7280;
            margin-top: 5px;
        }

        @media (max-width: 600px) {

            .container {
                width: 92%;
            }

            .card {
                padding: 18px;
            }

            header h1 {
                font-size: 23px;
            }

            .delete-btn {
                margin-left: 0;
                margin-top: 8px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Clinton Ncube</h1>
    <p>Personal Website Admin Dashboard</p>
</header>

<div class="container">

    <!-- LOGIN -->

    <div id="loginSection" class="card login-box">

        <h2>Admin Login</h2>

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="username"
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="save-btn"
            id="loginButton"
        >
            Login
        </button>

        <div id="loginMessage" class="message"></div>

    </div>


    <!-- ADMIN DASHBOARD -->

    <div id="dashboardSection" class="hidden">

        <!-- TOP BAR -->

        <div class="card">

            <div class="top-bar">

                <div>
                    <h2>Admin Dashboard</h2>
                    <p>You are logged in.</p>
                </div>

                <button
                    type="button"
                    class="logout-btn"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </div>


        <!-- HOME INFORMATION -->

        <div class="card">

            <h2>Home Information Manager</h2>

            <label for="homeName">Name</label>

            <input
                type="text"
                id="homeName"
                placeholder="Clinton Ncube"
            >

            <label for="homeWelcome">Welcome Message</label>

            <textarea
                id="homeWelcome"
                placeholder="Enter your welcome message"
            ></textarea>

            <label for="homeGoal">Goal</label>

            <textarea
                id="homeGoal"
                placeholder="Enter your goal"
            ></textarea>

            <label for="homeAbout">About</label>

            <textarea
                id="homeAbout"
                placeholder="Enter a short description about yourself"
            ></textarea>

            <label for="lastUpdated">Year</label>

            <input
                type="text"
                id="lastUpdated"
                placeholder="2026"
            >

            <button
                type="button"
                class="save-btn"
                id="saveHomeButton"
            >
                Save Home Information
            </button>

            <div id="homeMessage" class="message"></div>

        </div>
