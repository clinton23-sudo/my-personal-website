<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | Clinton Ncube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            color: #d1d5db;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
            color: #111827;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            margin-left: 8px;
        }

        .back-btn {
            background: #374151;
            color: white;
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .login-box h1 {
            text-align: center;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .item {
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            background: #f9fafb;
        }

        .item h3 {
            margin-top: 0;
        }

        .hidden {
            display: none;
        }

        .top-buttons {
            margin-top: 15px;
        }

        .status {
            padding: 12px;
            background: #eff6ff;
            color: #1e40af;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginSection" class="login-box">

    <h1>Admin Login</h1>

    <p style="text-align:center;">
        Clinton Ncube Website
    </p>

    <label>Email</label>
    <input
        type="email"
        id="loginEmail"
        placeholder="Enter admin email"
    >

    <label>Password</label>
    <input
        type="password"
        id="loginPassword"
        placeholder="Enter password"
    >

    <button class="save-btn" onclick="login()">
        Login
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

    <header>

        <h1>Clinton Ncube Admin Dashboard</h1>

        <p>
            Manage your website online
        </p>

        <div class="top-buttons">

            <button
                class="back-btn"
                onclick="window.location.href='index.html'"
            >
                ← Back to Website
            </button>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <div class="container">

        <div class="status">
            ✅ You are logged in. Changes saved here will be stored online in Firebase.
        </div>


        <!-- HOME -->
        <div class="card">

            <h2>🏠 Home Information</h2>

            <label>Name</label>

            <input
                type="text"
                id="homeName"
                value="Clinton Ncube"
            >

            <label>Welcome Message</label>

            <textarea id="homeWelcome"></textarea>

            <label>Goal</label>

            <textarea id="homeGoal"></textarea>

            <label>About Me</label>

            <textarea id="homeAbout"></textarea>

            <button
                class="save-btn"
                onclick="saveHome()"
            >
                Save Home Information
            </button>

            <div id="homeMessage" class="message"></div>

        </div>


        <!-- GALLERY -->
        <div class="card">

            <h2>🖼️ Gallery Manager</h2>

            <label>Photo Title</label>

            <input
                type="text"
                id="photoTitle"
                placeholder="Example: School Event"
            >

            <label>Image Filename</label>

            <input
                type="text"
                id="photoFile"
                placeholder="Example: photo1.jpg"
            >

            <label>Description</label>

            <textarea
                id="photoDescription"
                placeholder="Describe the photo"
            ></textarea>

            <button
                class="save-btn"
                onclick="addPhoto()"
            >
                Add Photo
            </button>

            <div id="galleryMessage" class="message"></div>

            <h3>Current Gallery</h3>

            <div id="galleryList"></div>

        </div>


        <!-- ACHIEVEMENTS -->
        <div class="card">

            <h2>🏆 Achievements Manager</h2>

            <label>Achievement Title</label>

            <input
                type="text"
                id="achievementTitle"
                placeholder="Example: Academic Achievement"
            >

            <label>Description</label>

            <textarea
                id="achievementDescription"
                placeholder="Describe the achievement"
            ></textarea>

            <button
                class="save-btn"
                onclick="addAchievement()"
            >
                Add Achievement
            </button>

            <div id="achievementMessage" class="message"></div>

            <h3>Current Achievements</h3>

            <div id="achievementList"></div>

        </div>

    </div>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        signOut
    }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
        getDatabase,
        ref,
        get,
        set,
        push,
        remove
    }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    /* =========================
       FIREBASE CONFIGURATION
       ========================= */

    const firebaseConfig = {

        apiKey: "AIzaSyCWKqho3sPz1W6wGEftS3nNSaJigR-1vd4",

        authDomain:
            "clinton-ncube-website.firebaseapp.com",

        databaseURL:
            "https://clinton-ncube-website-default-rtdb.firebaseio.com",

        projectId:
            "clinton-ncube-website",

        storageBucket:
            "clinton-ncube-website.firebasestorage.app",

        messagingSenderId:
            "946671700613",

        appId:
            "1:946671700613:web:5d74536df1dbb0d35e77ec",

        measurementId:
            "G-K1S62MHHXP"
    };


    /* =========================
       INITIALIZE FIREBASE
       ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);


    /* =========================
       DEFAULT DATA
       ========================= */

    const defaultHome = {

        name: "Clinton Ncube",

        welcome:
            "Welcome to my personal website! This is my personal portfolio where I share information about myself, my projects, hobbies, skills and favourite memories.",

        goal:
            "My goal is to continue learning, improving my skills and creating useful and interesting projects.",

        about:
            "I am Clinton Ncube. I am a student who enjoys learning, developing new skills and working on creative projects.",

        lastUpdated: "2026"
    };


    const defaultGallery = [

        {
            title: "Photo 1",
            file: "IMG_20250802_093252.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 2",
            file: "IMG_20250802_093305.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 3",
            file: "WIN_20260814_16_48_08_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 4",
            file: "WIN_20260814_16_48_27_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 5",
            file: "WIN_20260814_16_48_35_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 6",
            file: "WIN_20260814_16_48_39_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 7",
            file: "WIN_20260814_16_49_03_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 8",
            file: "WIN_20260814_16_49_16_Pro.jpg",
            description: "A memorable moment."
        },

        {
            title: "Photo 9",
            file: "WIN_20260814_16_49_28_Pro.jpg",
            description: "A memorable moment."
        }

    ];


    const defaultAchievements = [

        {
            title: "Academic Achievement",
            description:
                "A record of my academic progress and achievements."
        },

        {
            title: "School Activities",
            description:
                "Participation in school activities, projects and events."
        },

        {
            title: "Personal Projects",
            description:
                "Creative and educational projects that I have worked on."
        }

    ];


    /* =========================
       LOGIN
       ========================= */

    window.login = async function () {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;


        if (!email || !password) {

            showMessage(
                "loginMessage",
                "Please enter your email and password.",
                false
            );

            return;
        }


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "loginMessage",
                "Login failed. Check your email and password.",
                false
            );

        }

    };


    /* =========================
       LOGOUT
       ========================= */

    window.logout = async function () {

        await signOut(auth);

    };


    /* =========================
       AUTH STATE
       ========================= */

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            document
                .getElementById("loginSection")
                .classList.add("hidden");

            document
                .getElementById("dashboard")
                .classList.remove("hidden");

            await initializeDatabase();

            await loadHome();

            await loadGallery();

            await loadAchievements();

        }

        else {

            document
                .getElementById("loginSection")
                .classList.remove("hidden");

            document
                .getElementById("dashboard")
                .classList.add("hidden");

        }

    });


    /* =========================
       INITIAL DATABASE
       ========================= */

    async function initializeDatabase() {

        const homeRef =
            ref(db, "websiteData");

        const homeSnapshot =
            await get(homeRef);


        if (!homeSnapshot.exists()) {

            await set(
                homeRef,
                defaultHome
            );

        }


        const galleryRef =
            ref(db, "gallery");

        const gallerySnapshot =
            await get(galleryRef);


        if (!gallerySnapshot.exists()) {

            const galleryObject = {};

            defaultGallery.forEach(photo => {

                const newRef =
                    push(galleryRef);

                galleryObject[newRef.key] = photo;

            });

            await set(
                galleryRef,
                galleryObject
            );

        }


        const achievementsRef =
            ref(db, "achievements");

        const achievementsSnapshot =
            await get(achievementsRef);


        if (!achievementsSnapshot.exists()) {

            const achievementsObject = {};

            defaultAchievements.forEach(achievement => {

                const newRef =
                    push(achievementsRef);

                achievementsObject[newRef.key] =
                    achievement;

            });

            await set(
                achievementsRef,
                achievementsObject
            );

        }

    }


    /* =========================
       SAVE HOME
       ========================= */

    window.saveHome = async function () {

        const data = {

            name:
                document.getElementById("homeName").value,

            welcome:
                document.getElementById("homeWelcome").value,

            goal:
                document.getElementById("homeGoal").value,

            about:
                document.getElementById("homeAbout").value,

            lastUpdated:
                new Date().getFullYear().toString()

        };


        try {

            await set(
                ref(db, "websiteData"),
                data
            );


            showMessage(
                "homeMessage",
                "Home information saved online successfully!",
                true
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "homeMessage",
                "Could not save Home information.",
                false
            );

        }

    };


    /* =========================
       LOAD HOME
       ========================= */

    async function loadHome() {

        const snapshot =
            await get(
                ref(db, "websiteData")
            );


        if (!snapshot.exists()) return;


        const data =
            snapshot.val();


        document.getElementById("homeName").value =
            data.name || "";

        document.getElementById("homeWelcome").value =
            data.welcome || "";

        document.getElementById("homeGoal").value =
            data.goal || "";

        document.getElementById("homeAbout").value =
            data.about || "";

    }


    /* =========================
       ADD PHOTO
       ========================= */

    window.addPhoto = async function () {

        const title =
            document.getElementById("photoTitle").value.trim();

        const file =
            document.getElementById("photoFile").value.trim();

        const description =
            document.getElementById("photoDescription").value.trim();


        if (!title || !file) {

            showMessage(
                "galleryMessage",
                "Please enter a photo title and filename.",
                false
            );

            return;

        }


        try {

            const galleryRef =
                ref(db, "gallery");

            const newPhotoRef =
                push(galleryRef);


            await set(
                newPhotoRef,
                {
                    title: title,
                    file: file,
                    description: description
                }
            );


            document.getElementById("photoTitle").value = "";

            document.getElementById("photoFile").value = "";

            document.getElementById("photoDescription").value = "";


            showMessage(
                "galleryMessage",
                "Photo added successfully!",
                true
            );


            await loadGallery();

        }

        catch (error) {

            console.error(error);

            showMessage(
                "galleryMessage",
                "Could not add photo.",
                false
            );

        }

    };


    /* =========================
       LOAD GALLERY
       ========================= */

    async function loadGallery() {

        const snapshot =
            await get(
                ref(db, "gallery")
            );


        const list =
            document.getElementById("galleryList");


        list.innerHTML = "";


        if (!snapshot.exists()) {

            list.innerHTML =
                "<p>No photos yet.</p>";

            return;

        }


        const gallery =
            snapshot.val();


        Object.entries(gallery).forEach(
            ([id, photo]) => {

                const item =
                    document.createElement("div");

                item.className = "item";


                item.innerHTML = `

                    <h3>${escapeHTML(photo.title || "Untitled")}</h3>

                    <p>
                        <strong>Filename:</strong>
                        ${escapeHTML(photo.file || "")}
                    </p>

                    <p>
                        ${escapeHTML(photo.description || "")}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deletePhoto('${id}')"
                    >
                        Delete
                    </button>

                `;


                list.appendChild(item);

            }
        );

    }


    /* =========================
       DELETE PHOTO
       ========================= */

    window.deletePhoto = async function (id) {

        if (!confirm("Delete this photo?")) {
            return;
        }


        try {

            await remove(
                ref(db, "gallery/" + id)
            );


            await loadGallery();


            showMessage(
                "galleryMessage",
                "Photo deleted successfully.",
                true
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "galleryMessage",
                "Could not delete photo.",
                false
            );

        }

    };


    /* =========================
       ADD ACHIEVEMENT
       ========================= */

    window.addAchievement = async function () {

        const title =
            document
                .getElementById("achievementTitle")
                .value
                .trim();


        const description =
            document
                .getElementById("achievementDescription")
                .value
                .trim();


        if (!title || !description) {

            showMessage(
                "achievementMessage",
                "Please enter the title and description.",
                false
            );

            return;

        }


        try {

            const achievementsRef =
                ref(db, "achievements");

            const newAchievementRef =
                push(achievementsRef);


            await set(
                newAchievementRef,
                {
                    title: title,
                    description: description
                }
            );


            document
                .getElementById("achievementTitle")
                .value = "";


            document
                .getElementById("achievementDescription")
                .value = "";


            showMessage(
                "achievementMessage",
                "Achievement added successfully!",
                true
            );


            await loadAchievements();

        }

        catch (error) {

            console.error(error);

            showMessage(
                "achievementMessage",
                "Could not add achievement.",
                false
            );

        }

    };


    /* =========================
       LOAD ACHIEVEMENTS
       ========================= */

    async function loadAchievements() {

        const snapshot =
            await get(
                ref(db, "achievements")
            );


        const list =
            document.getElementById(
                "achievementList"
            );


        list.innerHTML = "";


        if (!snapshot.exists()) {

            list.innerHTML =
                "<p>No achievements yet.</p>";

            return;

        }


        const achievements =
            snapshot.val();


        Object.entries(achievements).forEach(
            ([id, achievement]) => {

                const item =
                    document.createElement("div");

                item.className = "item";


                item.innerHTML = `

                    <h3>
                        ${escapeHTML(
                            achievement.title || "Untitled"
                        )}
                    </h3>

                    <p>
                        ${escapeHTML(
                            achievement.description || ""
                        )}
                    </p>

                    <button
                        class="delete-btn"
                        onclick="deleteAchievement('${id}')"
                    >
                        Delete
                    </button>

                `;


                list.appendChild(item);

            }
        );

    }


    /* =========================
       DELETE ACHIEVEMENT
       ========================= */

    window.deleteAchievement =
        async function (id) {

            if (
                !confirm(
                    "Delete this achievement?"
                )
            ) {
                return;
            }


            try {

                await remove(
                    ref(
                        db,
                        "achievements/" + id
                    )
                );


                await loadAchievements();


                showMessage(
                    "achievementMessage",
                    "Achievement deleted successfully.",
                    true
                );

            }

            catch (error) {

                console.error(error);

                showMessage(
                    "achievementMessage",
                    "Could not delete achievement.",
                    false
                );

            }

        };


    /* =========================
       MESSAGE
       ========================= */

    function showMessage(
        elementId,
        text,
        success
    ) {

        const element =
            document.getElementById(elementId);


        element.textContent = text;

        element.className =
            "message " +
            (success ? "success" : "error");

        element.style.display = "block";


        setTimeout(() => {

            element.style.display = "none";

        }, 4000);

    }


    /* =========================
       SECURITY
       ========================= */

    function escapeHTML(value) {

        return String(value)

            .replace(/&/g, "&amp;")

            .replace(/</g, "&lt;")

            .replace(/>/g, "&gt;")

            .replace(/"/g, "&quot;")

            .replace(/'/g, "&#039;");

    }

</script>

</body>
</html>
