<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        * {

        h1 {
            text-align: center;

        button {

            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            line-height: 1.5;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        #dashboard {
            display: none;
            text-align: center;
        }

        #dashboard h2 {
            color: #0f172a;
        }

        .logout {
            margin-top: 20px;

        }

        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- LOGIN SECTION -->
        <div id="loginSection">

            <h1>Clinton Ncube</h1>

            <p class="subtitle">
                Admin Dashboard
            </p>

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

            <button id="loginButton">
                Login
            </button>

            <div id="status"></div>

        </div>


        <!-- DASHBOARD SECTION -->
        <div id="dashboard">

            <h2>
                Welcome, Clinton!
            </h2>

            <p>
                You have successfully logged into
                the Admin Dashboard.
            </p>

            <p id="loggedInEmail"></p>

            <button
                id="logoutButton"
                class="logout">
                Logout
            </button>

        </div>

    </div>


    <!-- FIREBASE -->
    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


        /* =========================================
           FIREBASE CONFIGURATION
        ========================================= */

        const firebaseConfig = {

            apiKey:
            "AIzaSyB66c1Tymv5lkTxY89HLbX4S_QTpAZQVUE",

            authDomain:
            "clinton-ncube-website.firebaseapp.com",

            databaseURL:
            "https://clinton-ncube-website-default-rtdb.firebaseio.com",

            projectId:
            "clinton-ncube-website",

            storageBucket:
            "clinton-ncube-website.firebasestorage.app",

            messagingSenderId:
            "946671700613",

            appId:
            "1:946671700613:web:5d74536df1dbb0d35e77ec",

            measurementId:
            "G-K1S62MHHXP"
        };


        /* =========================================
           INITIALIZE FIREBASE
        ========================================= */

        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        /* =========================================
           GET HTML ELEMENTS
        ========================================= */

        const loginSection =
            document.getElementById(
                "loginSection"
            );

        const dashboard =
            document.getElementById(
                "dashboard"
            );

        const emailInput =
            document.getElementById(
                "email"
            );

        const passwordInput =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const logoutButton =
            document.getElementById(
                "logoutButton"
            );

        const status =
            document.getElementById(
                "status"
            );

        const loggedInEmail =
            document.getElementById(
                "loggedInEmail"
            );


        /* =========================================
           SHOW MESSAGE
        ========================================= */

        function showStatus(
            message,
            type
        ) {

            status.textContent =
                message;

            status.className =
                type;

        }


        /* =========================================
           LOGIN
        ========================================= */

        loginButton.addEventListener(
            "click",
            async function () {

                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                if (
                    !email ||
                    !password
                ) {

                    showStatus(
                        "Please enter your email and password.",
                        "error"
                    );

                    return;
                }


                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "Logging in...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                }

                catch (error) {

                    console.error(
                        "Firebase login error:",
                        error
                    );


                    let message =
                        "Login failed.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message =
                            "The email or password is incorrect.";

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message =
                            "No Firebase account was found with this email.";

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message =
                            "The password is incorrect.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-api-key"
                    ) {

                        message =
                            "Firebase API key is invalid.";

                    }

                    else if (
                        error.code ===
                        "auth/api-key-not-valid"
                    ) {

                        message =
                            "Firebase API key is not valid.";

                    }

                    else {

                        message =
                            "Login failed: " +
                            error.code;
                    }


                    showStatus(
                        message,
                        "error"
                    );


                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );


        /* =========================================
           LOGOUT
        ========================================= */

        logoutButton.addEventListener(
            "click",
            async function () {

                try {

                    await signOut(auth);

                }

                catch (error) {

                    console.error(error);

                }

            }
        );


        /* =========================================
           AUTHENTICATION STATE
        ========================================= */

        onAuthStateChanged(
            auth,
            function (user) {

                if (user) {

                    loginSection.style.display =
                        "none";

                    dashboard.style.display =
                        "block";

                    loggedInEmail.textContent =
                        "Logged in as: " +
                        user.email;

                }

                else {

                    loginSection.style.display =
                        "block";

                    dashboard.style.display =
                        "none";

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Login";

                }

            }
        );

    </script>

</body>

</html>
