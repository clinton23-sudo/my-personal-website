<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About | Clinton Ncube</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin-top: 10px;
            color: #d1d5db;
        }

        nav {
            background: #1f2937;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #60a5fa;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 40px auto;
        }

        .about-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .about-card h2 {
            margin-top: 0;
            color: #111827;
            font-size: 30px;
        }

        .about-card p {
            color: #555;
            line-height: 1.8;
            font-size: 17px;
        }

        .info-box {
            margin-top: 25px;
            padding: 20px;
            background: #f9fafb;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #111827;
        }

        .info-box p {
            margin-bottom: 0;
        }

        footer {
            margin-top: 50px;
            background: #111827;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 28px;
            }

            nav a {
                display: inline-block;
                margin: 5px;
                font-size: 14px;
            }

            .about-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1 id="about-name">Clinton Ncube</h1>
    <p>My Personal Website</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="skills.html">Skills</a>
    <a href="gallery.html">Gallery</a>
    <a href="achievements.html">Achievements</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="container">

    <div class="about-card">

        <h2>About Me</h2>

        <p id="about-text">
            Loading...
        </p>

        <div class="info-box">

            <h3>My Goal</h3>

            <p id="about-goal">
                Loading...
            </p>

        </div>

    </div>

</div>

<footer>
    <p>© 2026 Clinton Ncube. All rights reserved.</p>
</footer>


<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


    const firebaseConfig = {

        apiKey: "AIzaSyCWKqho3sPz1W6wGEftS3nNSaJigR-1vd4",

        authDomain:
            "clinton-ncube-website.firebaseapp.com",

        databaseURL:
            "https://clinton-ncube-website-default-rtdb.firebaseio.com",

        projectId:
            "clinton-ncube-website",

        storageBucket:
            "clinton-ncube-website.firebasestorage.app",

        messagingSenderId:
            "946671700613",

        appId:
            "1:946671700613:web:5d74536df1dbb0d35e77ec",

        measurementId:
            "G-K1S62MHHXP"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    onValue(
        ref(db, "websiteData"),
        (snapshot) => {

            if (!snapshot.exists()) {
                return;
            }

            const data = snapshot.val();


            if (data.name) {

                document.getElementById(
                    "about-name"
                ).textContent = data.name;

            }


            if (data.about) {

                document.getElementById(
                    "about-text"
                ).textContent = data.about;

            }


            if (data.goal) {

                document.getElementById(
                    "about-goal"
                ).textContent = data.goal;

            }

        },
        (error) => {

            console.error(
                "Firebase error:",
                error
            );

            document.getElementById(
                "about-text"
            ).textContent =
                "Unable to load information.";

            document.getElementById(
                "about-goal"
            ).textContent =
                "Unable to load goal.";

        }
    );

</script>

</body>
</html>
